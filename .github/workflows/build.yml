name: FMScoupler null model tests

on: [push, pull_request]

jobs:
  mkmf_null_model:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/noaa-gfdl/fms/fms-ci-rocky-gnu:13.2.0
      env:
        CC: mpicc
        FC: mpif90
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Run build test
        run: t/test_null_mkmf.sh
  cmake_null_model:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Install dependencies
        run: apt install -y mpich libmpich-dev libnetcdf-dev libnetcdff-dev netcdf-bin libyaml libyaml-dev cmake gfortran
      - name: Run build test
        env:
          CC: mpicc
          FC: mpifort
        run: t/test_null_cmake.sh
